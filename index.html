<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>个人专属工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="工作台" />
  <meta name="theme-color" content="#4a63e8" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 左侧竖向导航栏 -->
    <aside id="nav">
      <div class="nav-brand">
        <span class="brand-dot"></span>
        <span class="brand-text">工作台</span>
      </div>
      <nav class="nav-menu" id="navMenu">
        <button class="nav-item active" data-page="daily-plan" data-color="blue">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6 4h6"/></svg></span>
          <span>每日计划</span>
        </button>
        <button class="nav-item" data-page="viral-videos" data-color="red">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></span>
          <span>爆款视频</span>
        </button>
        <button class="nav-item" data-page="vv-analyzer" data-color="red">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></span>
          <span>视频解析</span>
        </button>
        <button class="nav-item" data-page="vv-library" data-color="purple">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M3 7l9-4 9 4-9 4-9-4zm0 5l9 4 9-4M3 17l9 4 9-4"/></svg></span>
          <span>素材库</span>
        </button>
        <button class="nav-item" data-page="inspiration" data-color="yellow">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg></span>
          <span>灵感记录</span>
        </button>
        <button class="nav-item" data-page="finance" data-color="green">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg></span>
          <span>金融热点</span>
        </button>
        <button class="nav-item" data-page="checkin" data-color="purple">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span>
          <span>打卡计划</span>
        </button>
        <button class="nav-item" data-page="reading" data-color="teal">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg></span>
          <span>阅读读书</span>
        </button>
        <button class="nav-item" data-page="recipes" data-color="orange">
          <span class="nav-ico-wrap"><svg viewBox="0 0 24 24" class="nav-ico"><path d="M8 5v3a3 3 0 0 0 6 0V5h2v3a5 5 0 0 1-10 0V5h2zm-4 7h16v2H4v-2zm2 4h12v3a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-3z"/></svg></span>
          <span>今日菜谱</span>
        </button>
      </nav>
      <button class="nav-settings" id="openSettings" title="存储设置">
        <svg viewBox="0 0 24 24" class="nav-ico"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.3-2.6h-4l-.3 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>
        <span>存储</span>
      </button>
    </aside>

    <!-- 主内容区 -->
    <main id="content">
      <header id="topbar">
        <h1 id="pageTitle">每日计划</h1>
        <div class="top-right">
          <span id="syncPill" class="sync-pill" title="数据存储于本机">● 本地</span>
          <div id="clock" class="clock"></div>
        </div>
      </header>
      <section id="pageRoot" class="page-root"></section>
    </main>
  </div>

  <!-- 弹窗容器 -->
  <div id="modalRoot"></div>
  <!-- 应用内提醒容器 -->
  <div id="toastRoot" class="toast-root"></div>
  <div id="notifyRoot" class="notify-root"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/jszip.min.js"></script>
  <script src="assets/js/epub.min.js"></script>
  <script src="assets/js/pages/daily-plan.js"></script>
  <script src="assets/js/pages/viral-videos.js"></script>
  <script src="assets/js/pages/inspiration.js"></script>
  <script src="assets/js/pages/finance.js"></script>
  <script src="assets/js/pages/checkin.js"></script>
  <script src="assets/js/pages/reading.js"></script>
  <script src="assets/js/pages/recipes-extra.js"></script>
  <script src="assets/js/pages/recipes.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
